<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" role="img" aria-labelledby="gafMeTitle gafMeDesc">
  <title id="gafMeTitle">GAF Master Elite certified roofing contractor</title>
  <desc id="gafMeDesc">Credential-style badge for the GAF Master Elite contractor program.</desc>
  <defs>
    <linearGradient id="meBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c3d6b"/>
      <stop offset="100%" stop-color="#051f38"/>
    </linearGradient>
    <linearGradient id="meGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a227"/>
      <stop offset="50%" stop-color="#e8d089"/>
      <stop offset="100%" stop-color="#b8941f"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="316" height="146" rx="10" fill="url(#meBg)" stroke="#021a2e" stroke-width="2"/>
  <rect x="2" y="2" width="316" height="14" rx="10" fill="url(#meGold)"/>
  <rect x="2" y="10" width="316" height="6" fill="url(#meGold)"/>
  <text x="160" y="44" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="800" letter-spacing="0.14em">GAF</text>
  <text
    x="160"
    y="86"
    text-anchor="middle"
    fill="#ffffff"
    font-family="system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="26"
    font-weight="800"
    letter-spacing="0.08em"
  >
    <tspan>MASTER ELITE</tspan>
    <tspan font-size="12" baseline-shift="super">&#174;</tspan>
  </text>
  <text x="160" y="112" text-anchor="middle" fill="#b8d4ec" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" letter-spacing="0.18em">CERTIFIED ROOFING CONTRACTOR</text>
  <text x="160" y="134" text-anchor="middle" fill="#7fa3c7" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.5" font-weight="500">Top-tier GAF residential credential</text>
</svg>
