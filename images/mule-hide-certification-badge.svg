<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-labelledby="mhTitle mhDesc">
  <title id="mhTitle">Mule-Hide certification badge</title>
  <desc id="mhDesc">Badge for Mule-Hide certified roofing system installations.</desc>
  <defs>
    <linearGradient id="mhBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3a025"/>
      <stop offset="100%" stop-color="#ce7600"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="316" height="156" rx="12" fill="url(#mhBg)" stroke="#9a5800" stroke-width="2"/>
  <text x="160" y="62" text-anchor="middle" fill="#2f1900" font-family="Arial, sans-serif" font-size="34" font-weight="800">MULE-HIDE</text>
  <text x="160" y="94" text-anchor="middle" fill="#4f2b00" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0.14em">CERTIFIED</text>
  <text x="160" y="121" text-anchor="middle" fill="#2f1900" font-family="Arial, sans-serif" font-size="15" font-weight="700">ROOFING SYSTEMS</text>
